<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display flex</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        
        body,html{
            height: 100vh;
            width: 100vw;
            
        }
         
        div.container{
            height: 500px;
            width: 500px;
            background-color: rgba(42, 165, 97, 0.747);
            border: 2px solid black;
            display: flex;
            flex-flow: column;
            justify-content:space-between;
            margin: auto;
            
        
           
            
            
        }

        div.filho{
            height: 100px;
            width: 100px;
            background-color: brown;
            border: 1px solid black;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            
            
        }
    </style>
</head>
<body>
    <div class="container">
         <div class="filho">1</div>
         <div class="filho">2</div>
         <div class="filho">3</div>
    </div>
</body>
</html>
